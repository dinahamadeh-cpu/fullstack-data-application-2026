{% extends "base.html" %}

{% block title %}Proposer un objet — GearShare{% endblock %}

{% block content %}
<p><a href="/items">← Annuler</a></p>
<h1>Proposer un nouvel objet</h1>

{% if erreurs %}
  <div class="alerte alerte-erreur">
    <ul>
      {% for err in erreurs %}
        <li>{{ err }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}

<form method="post" action="/items">
  <label for="titre">Titre :</label>
  <input type="text" id="titre" name="titre" value="{{ saisie.titre if saisie else '' }}" required minlength="3">

  <label for="description">Description :</label>
  <textarea id="description" name="description" rows="4">{{ saisie.description if saisie else '' }}</textarea>

  <label for="tarif_jour">Tarif par jour (€) :</label>
  <input type="number" id="tarif_jour" name="tarif_jour" step="0.01" min="0.01" value="{{ saisie.tarif_jour if saisie else '' }}" required>

  <label>
    <input type="checkbox" name="disponible" {% if not saisie or saisie.disponible %}checked{% endif %}>
    Disponible immédiatement
  </label>

  <button type="submit">Ajouter l'objet</button>
</form>
{% endblock %}
